name: Verify insiders parser (temporary)
on:
  push:
    branches: [insider-verify]
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Live health check
        run: |
          for u in https://hillradar-ai.fly.dev https://app.hillradar.com; do
            echo "== $u"; curl -sS -m 30 "$u/api/health" || true; echo
            curl -sS -m 30 -o /dev/null -w "insiders page HTTP %{http_code}\n" "$u/insiders" || true
            curl -sS -m 30 -o /dev/null -w "insiders API (no login, expect 401) HTTP %{http_code}\n" "$u/api/insiders" || true
            curl -sS -m 30 "$u/" | grep -o 'assets/index-[^"]*\.js' | head -1 | while read js; do curl -sS -m 30 "$u/$js" | grep -c 'Corporate insiders\|/insiders' | sed 's/^/bundle mentions insiders: /'; done
          done
