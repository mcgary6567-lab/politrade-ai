name: Verify insiders parser (temporary)
on:
  push:
    branches: [insider-verify]
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: cd server && npm ci --silent
      - run: cd server && DB_PATH=/tmp/v.db npx tsx scripts/verify-insiders.ts 2026-10-23 80
